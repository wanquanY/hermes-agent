name: Hermes v3 gates

# Blocking CI gates for the Hermes Agent Backend v3.0.2/v3.0.3 landing
# (see docs/hermes_agent_architecture_v3.md § J1-J11 invariants).
#
# Three gates:
#   1. v3 pytest — the six v3 directories must stay green.
#      xfail markers on legacy shadow-writer probes are OK; they
#      encode the "not yet switched" reality (docs/v3_audit_report.md).
#   2. import-linter — the layered skeleton contract must remain KEPT.
#      Runs against the .importlinter config at repo root.
#   3. silent-swallow lint — hermes_agent/ must remain 0 findings.
#      The whole-repo whole scan is *not* blocking here (encoded as xfail).

on:
  push:
    branches: [main]
    paths:
      - "hermes_agent/**"
      - "tests/domain/**"
      - "tests/gateway_v3/**"
      - "tests/observability/**"
      - "tests/orchestration/**"
      - "tests/repositories/**"
      - "tests/transport/**"
      - ".importlinter"
      - ".github/workflows/hermes-v3-gates.yml"
  pull_request:
    branches: [main]
    paths:
      - "hermes_agent/**"
      - "tests/domain/**"
      - "tests/gateway_v3/**"
      - "tests/observability/**"
      - "tests/orchestration/**"
      - "tests/repositories/**"
      - "tests/transport/**"
      - ".importlinter"
      - ".github/workflows/hermes-v3-gates.yml"

permissions:
  contents: read

concurrency:
  group: hermes-v3-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3-pytest:
    name: v3 pytest (six directories, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          # The v3 test set only touches stdlib + our package; install the
          # project in editable mode so imports resolve.
          pip install -e . || true
          pip install pytest pytest-timeout pytest-asyncio pytest-anyio

      - name: Run v3 pytest
        run: |
          python -m pytest \
            tests/transport \
            tests/gateway_v3 \
            tests/orchestration \
            tests/repositories \
            tests/observability \
            tests/domain \
            -q

  import-linter:
    name: import-linter (layered skeleton, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install import-linter
        run: |
          python -m pip install --upgrade pip
          pip install import-linter

      - name: Run lint-imports
        run: lint-imports

  silent-swallow-v3:
    name: silent-swallow lint (v3 tree only, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Run silent-swallow scanner on hermes_agent/
        run: |
          python - <<'EOF'
          from hermes_agent.observability.silent_swallow_lint import scan_paths
          from pathlib import Path
          import sys
          f = scan_paths([Path('hermes_agent')])
          if f:
              print(f"silent-swallow findings inside hermes_agent/ ({len(f)}):")
              for x in f:
                  print(f"  {x.file}:{x.line} except {x.exception_type}")
              sys.exit(1)
          print("hermes_agent/ clean —— 0 silent-swallow findings")
          EOF
